# ---------------------------------------------------------------------------
# Self-hosted deployment: everything is configured directly in this file.
# No .env file is needed. Before the first `docker compose up -d --build`,
# edit the values marked "CHANGE ME" below:
#
#   1. Database password  -> must be IDENTICAL in the 3 places marked (1) (2) (3)
#   2. JWT_SECRET         -> any random string of at least 32 characters
#                            (e.g. `openssl rand -base64 32`)
#
# Changing the database password after the first start requires resetting the
# volume (`docker compose down -v`), because Postgres only reads it on init.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: loto-postgres
    restart: always
    environment:
      POSTGRES_USER: loto
      POSTGRES_PASSWORD: loto_secure_password_2026            # CHANGE ME (1)
      POSTGRES_DB: loto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loto -d loto"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - loto-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loto-web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Connection strings: format is postgresql://USER:PASSWORD@HOST:PORT/DB
      # The password must match POSTGRES_PASSWORD of the postgres service.
      POSTGRES_PRISMA_URL: postgresql://loto:loto_secure_password_2026@postgres:5432/loto        # CHANGE ME (2)
      POSTGRES_URL_NON_POOLING: postgresql://loto:loto_secure_password_2026@postgres:5432/loto   # CHANGE ME (3)
      # Secret used to sign the authentication cookies (min. 32 characters)
      JWT_SECRET: change_this_to_a_random_secret_in_production_32chars                           # CHANGE ME
    ports:
      - "3000:3000"
    networks:
      - loto-network

volumes:
  postgres_data:

networks:
  loto-network:
    driver: bridge
